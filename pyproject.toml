[project]
name = "fast-partial-tracking"
version = "0.1.0"
description = "Fast partial tracking of audio through linear programming (Python port of the DAFx-18 MATLAB code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
