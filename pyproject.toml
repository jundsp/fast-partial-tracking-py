[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-partial-tracking"
version = "0.1.0"
description = "Fast partial tracking of audio through linear programming (Neri & Depalle, DAFx-18)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julian Neri" }]
keywords = ["audio", "sinusoidal modeling", "partial tracking", "DSP", "SDIF"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "pyarrow>=14",
]

[project.optional-dependencies]
fast = ["numexpr>=2.8"]
plot = ["matplotlib>=3.7"]
dataframes = ["polars>=0.20", "pandas>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "matplotlib>=3.7",
    "numexpr>=2.8",
    "polars>=0.20",
    "pandas>=2.0",
]

[project.scripts]
fpt = "fast_partial_tracking.cli:main"

[project.urls]
Repository = "https://github.com/jundsp/fast-partial-tracking-py"
"MATLAB original" = "https://github.com/jundsp/Fast-Partial-Tracking"

[tool.setuptools.packages.find]
where = ["."]
include = ["fast_partial_tracking*"]

[tool.setuptools.package-data]
fast_partial_tracking = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "matlab: needs a local MATLAB installation (enable with --matlab)",
]
